services:
  db:
    image: mysql:8.4
    container_name: portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass-dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portal}
      MYSQL_USER: ${MYSQL_USER:-portal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portalpass-dev}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: portal-backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-cambiar-en-produccion-0123456789abcdef}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-portal}:${MYSQL_PASSWORD:-portalpass-dev}@db:3306/${MYSQL_DATABASE:-portal}?charset=utf8mb4
      ALLOWED_ORIGINS: '["http://localhost:4321"]'
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Bogota}
      GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY:-}
      HOLIDAYS_PROVIDER: ${HOLIDAYS_PROVIDER:-auto}
      DEBUG: "true"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4321}
      WEEKLY_REMINDER_ENABLED: ${WEEKLY_REMINDER_ENABLED:-true}
    volumes:
      - portal_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: portal-frontend
    ports:
      - "4321:4321"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  mysql_data:
  portal_uploads: 